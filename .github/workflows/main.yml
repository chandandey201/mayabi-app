name: Build Mayabi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          printf '#!/bin/sh\nAPP_HOME="$(cd "$(dirname "$0")" && pwd)"\nCLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar\nexec java "-Dorg.gradle.appname=gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          chmod +x gradlew
          echo "JAR size: $(wc -c < gradle/wrapper/gradle-wrapper.jar)"

      - name: Fix project - move app folder to root
        run: |
          if [ ! -f "app/build.gradle" ] && [ -f "MayabiApp/app/build.gradle" ]; then
            echo "Moving app from MayabiApp/ to root"
            cp -r MayabiApp/app .
          fi
          if [ ! -f "settings.gradle" ] && [ -f "MayabiApp/settings.gradle" ]; then
            cp MayabiApp/settings.gradle .
          fi
          if [ ! -f "build.gradle" ] && [ -f "MayabiApp/build.gradle" ]; then
            cp MayabiApp/build.gradle .
          fi
          if [ ! -f "gradle.properties" ] && [ -f "MayabiApp/gradle.properties" ]; then
            cp MayabiApp/gradle.properties .
          fi

      - name: Verify structure
        run: |
          echo "ROOT:" && ls -la
          echo "APP:" && ls app/ || echo "NO APP FOLDER - BUILD WILL FAIL"
          echo "SETTINGS:" && cat settings.gradle
          echo "APP BUILD.GRADLE:" && cat app/build.gradle

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayabi-0.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

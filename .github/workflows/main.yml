name: Build Mayabi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Find and fix project structure
        run: |
          echo "=== Full repo structure ==="
          find . -not -path './.git/*' -not -path './MayabiApp/.gradle/*' | sort

          echo "=== Moving app folder to correct location ==="
          if [ -d "MayabiApp/app" ] && [ ! -d "app/src" ]; then
            echo "Found app in MayabiApp/ - moving to root"
            cp -r MayabiApp/app ./app
          fi

          if [ -f "MayabiApp/settings.gradle" ] && [ ! -f "settings.gradle" ]; then
            cp MayabiApp/settings.gradle .
          fi

          if [ -f "MayabiApp/build.gradle" ] && [ ! -f "build.gradle" ]; then
            cp MayabiApp/build.gradle .
          fi

          if [ -f "MayabiApp/gradle.properties" ] && [ ! -f "gradle.properties" ]; then
            cp MayabiApp/gradle.properties .
          fi

          echo "=== Structure after fix ==="
          ls -la
          echo "=== app folder ==="
          ls app/ 2>/dev/null || echo "No app folder!"
          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || echo "No settings.gradle!"

      - name: Setup Gradle wrapper files
        run: |
          mkdir -p gradle/wrapper

          printf 'distributionBase=GRADLE_USER_HOME\n' > gradle/wrapper/gradle-wrapper.properties
          printf 'distributionPath=wrapper/dists\n' >> gradle/wrapper/gradle-wrapper.properties
          printf 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip\n' >> gradle/wrapper/gradle-wrapper.properties
          printf 'zipStoreBase=GRADLE_USER_HOME\n' >> gradle/wrapper/gradle-wrapper.properties
          printf 'zipStorePath=wrapper/dists\n' >> gradle/wrapper/gradle-wrapper.properties

          echo "wrapper.properties:"
          cat gradle/wrapper/gradle-wrapper.properties

          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

          printf '#!/bin/sh\nAPP_HOME="$(cd "$(dirname "$0")" && pwd)"\nCLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar\nexec java "-Dorg.gradle.appname=gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          chmod +x gradlew
          echo "gradlew OK"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayabi-0.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

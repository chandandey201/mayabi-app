name: Build Mayabi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Fix root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          // Top-level build file
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          sed -i 's/^          //' build.gradle
          echo "=== root build.gradle ==="
          cat build.gradle

      - name: Fix settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mayabi"
          include ':app'
          EOF
          echo "=== settings.gradle ==="
          cat settings.gradle

      - name: Fix app/build.gradle
        run: |
          mkdir -p app
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mayabi.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mayabi.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "0.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildFeatures {
                  buildConfig true
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF
          echo "=== app/build.gradle ==="
          cat app/build.gradle

      - name: Fix app folder structure
        run: |
          if [ ! -d "app/src" ] && [ -d "MayabiApp/app/src" ]; then
            echo "Copying app/src from MayabiApp/"
            cp -r MayabiApp/app/src app/src
          fi
          if [ ! -f "app/proguard-rules.pro" ]; then
            echo "# ProGuard rules" > app/proguard-rules.pro
          fi
          echo "=== app structure ==="
          find app -type f | sort

      - name: Setup Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          printf '#!/bin/sh\nAPP_HOME="$(cd "$(dirname "$0")" && pwd)"\nCLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar\nexec java "-Dorg.gradle.appname=gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          chmod +x gradlew
          echo "Jar: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayabi-0.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

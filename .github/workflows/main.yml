name: Build Mayabi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "Jar size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Create gradlew if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found - creating it..."
            cat > gradlew << 'GRADLEW_SCRIPT'
#!/bin/sh
APP_HOME=$(CDPATH= cd -- "$(dirname -- "$PRG")" && pwd)
APP_BASE_NAME=$(basename "$0")
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
JAVACMD=java
exec "$JAVACMD" \
  "-Dorg.gradle.appname=$APP_BASE_NAME" \
  -classpath "$CLASSPATH" \
  org.gradle.wrapper.GradleWrapperMain \
  "$@"
GRADLEW_SCRIPT
          fi
          chmod +x gradlew
          echo "gradlew ready: $(ls -la gradlew)"

      - name: Show project structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== settings.gradle ==="
          cat settings.gradle
          echo "=== gradle/wrapper ==="
          ls -lh gradle/wrapper/

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayabi-0.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
